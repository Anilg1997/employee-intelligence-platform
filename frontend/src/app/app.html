<div class="app-container">
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" routerLink="/dashboard" aria-label="Employee Intelligence Platform home" (click)="closeNavigation()">
        <span class="brand-mark" aria-hidden="true">EI</span>
        <span class="brand-copy">
          <span class="brand-name">Employee Intelligence</span>
          <span class="brand-label">People operations platform</span>
        </span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="navigationOpen()"
        (click)="toggleNavigation()"
      >
        <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Menu</span>
      </button>

      <div class="header-status" aria-label="Workspace status">
        <span class="status-indicator" aria-hidden="true"></span>
        <span>Workspace online</span>
      </div>
    </div>

    <nav id="primary-navigation" class="main-nav" [class.is-open]="navigationOpen()" aria-label="Primary navigation">
      <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span>Overview</span>
      </a>
      <a routerLink="/employees" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">◎</span>
        <span>Employees</span>
      </a>
      <a routerLink="/attrition-prediction" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">⌁</span>
        <span>Attrition insights</span>
      </a>
      <a routerLink="/salary-prediction" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">$</span>
        <span>Salary insights</span>
      </a>
      <a routerLink="/performance-prediction" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">★</span>
        <span>Performance insights</span>
      </a>
      <a routerLink="/promotion-prediction" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">↗</span>
        <span>Promotion readiness</span>
      </a>
      <a routerLink="/risk-intelligence" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()"><span class="nav-icon" aria-hidden="true">◈</span><span>Risk intelligence</span></a>
      <a routerLink="/hr-assistant" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeNavigation()">
        <span class="nav-icon" aria-hidden="true">✦</span>
        <span>HR assistant</span>
      </a>
    </nav>
  </header>

  <main class="app-content">
    <div class="content-frame">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
