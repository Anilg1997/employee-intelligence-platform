name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: employee_intelligence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_intelligence"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/spring-boot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests with JaCoCo
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/employee_intelligence
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw -B -ntp test jacoco:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-coverage
          path: backend/spring-boot-app/target/site/jacoco/
          if-no-files-found: ignore

  python:
    name: ${{ matrix.name }} tests and coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ML
            path: ml-service
          - name: MCP
            path: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: python -m pip install -r requirements.txt coverage pytest
      - name: Run tests with coverage
        working-directory: ${{ matrix.path }}
        run: python -m coverage run -m pytest -q && python -m coverage xml
      - name: Enforce JSON-only ML model directory
        if: matrix.name == 'ML'
        working-directory: ml-service
        shell: bash
        run: |
          if find models -type f \( -name '*.pkl' -o -name '*.pickle' -o -name '*.joblib' -o -name '*.pki' \) -print -quit | grep -q .; then
            echo 'Binary model artifacts are not allowed; use the JSON-only artifact format.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-coverage
          path: ${{ matrix.path }}/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests with coverage
        run: npx ng test --watch=false --runner=vitest --coverage
      - name: Build frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ML image
        run: docker build --tag employee-intelligence-ml:ci ./ml-service
      - name: Build backend image
        run: docker build --tag employee-intelligence-backend:ci ./backend/spring-boot-app
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: employee-intelligence-ml:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: employee-intelligence-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
