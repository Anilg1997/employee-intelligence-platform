apiVersion: v1
kind: ConfigMap
metadata:
  name: employee-intelligence-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/employee_intelligence"
  ML_SERVICE_URL: "http://ml-service:8000"
  CORS_ALLOWED_ORIGINS: "https://employee-intelligence.example.com"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OUTBOX_PUBLISHER_ENABLED: "true"
  NOTIFICATIONS_CONSUMER_ENABLED: "true"
  NOTIFICATIONS_CONSUMER_GROUP: "notifications-v1"
  NOTIFICATIONS_CONSUMER_MAX_RETRIES: "3"
  NOTIFICATIONS_CONSUMER_RETRY_BACKOFF_MS: "1000"
  NOTIFICATIONS_CONSUMER_DEAD_LETTER_SUFFIX: ".DLT"
