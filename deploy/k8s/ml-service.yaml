apiVersion: v1
kind: Service
metadata:
  name: ml-service
spec:
  selector: {app: ml-service}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: ml-service}
  template:
    metadata:
      labels: {app: ml-service}
    spec:
      containers:
        - name: ml-service
          image: ghcr.io/replace-me/employee-intelligence-ml:latest
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
