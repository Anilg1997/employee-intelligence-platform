spring.application.name=employee-intelligence-api
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
# Keep operational endpoints off the application port. Override only when the
# deployment has an intentional management-network boundary.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=db
management.endpoint.health.group.liveness.include=livenessState
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.metrics.export.prometheus.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_intelligence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=true
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}
ml.service.connect-timeout-ms=${ML_SERVICE_CONNECT_TIMEOUT_MS:2000}
ml.service.read-timeout-ms=${ML_SERVICE_READ_TIMEOUT_MS:5000}
ml.models.directory=${ML_MODELS_DIRECTORY:}
employee.import.enabled=${EMPLOYEE_IMPORT_ENABLED:false}
employee.import.file=${EMPLOYEE_IMPORT_FILE:}
rag.ingestion.directory=${RAG_INGESTION_DIRECTORY:./documents}
rag.ingestion.max-file-size-bytes=${RAG_INGESTION_MAX_FILE_SIZE_BYTES:10485760}
rag.ingestion.allowed-extensions=${RAG_INGESTION_ALLOWED_EXTENSIONS:txt,md,csv,json}
rag.retrieval.min-similarity=${RAG_RETRIEVAL_MIN_SIMILARITY:0.75}

# LangChain4j + Ollama
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_CHAT_MODEL:llama3.2}
langchain4j.ollama.chat-model.temperature=${OLLAMA_CHAT_TEMPERATURE:0.7}
langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Authentication is deliberately disabled by the local profile. Enable it in
# a deployment with SECURITY_AUTH_ENABLED=true and an OIDC issuer URI.
security.auth.enabled=${SECURITY_AUTH_ENABLED:false}
security.oauth2.issuer-uri=${SECURITY_OAUTH2_ISSUER_URI:}

# Transactional outbox / Kafka. Publishing is retryable; the API remains usable
# when Kafka is temporarily unavailable because events stay pending in Postgres.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
outbox.kafka.topic=${OUTBOX_KAFKA_TOPIC:employee-intelligence.events}
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:false}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:100}
outbox.publisher.max-retries=${OUTBOX_PUBLISHER_MAX_RETRIES:3}
outbox.publisher.ack-timeout-ms=${OUTBOX_PUBLISHER_ACK_TIMEOUT_MS:5000}
outbox.publisher.retry-backoff-ms=${OUTBOX_PUBLISHER_RETRY_BACKOFF_MS:100}
outbox.publisher.fixed-delay-ms=${OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}

# Redis is opt-in. Cache keys always include the current tenant and only the
# dashboard read model is cached in this slice.
cache.redis.enabled=${CACHE_REDIS_ENABLED:false}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=${SPRING_CACHE_TYPE:none}
notifications.consumer.enabled=${NOTIFICATIONS_CONSUMER_ENABLED:false}
notifications.consumer.group=${NOTIFICATIONS_CONSUMER_GROUP:notifications-v1}
notifications.consumer.max-retries=${NOTIFICATIONS_CONSUMER_MAX_RETRIES:3}
notifications.consumer.retry-backoff-ms=${NOTIFICATIONS_CONSUMER_RETRY_BACKOFF_MS:1000}
notifications.consumer.dead-letter-suffix=${NOTIFICATIONS_CONSUMER_DEAD_LETTER_SUFFIX:.DLT}
notifications.sse.poll-ms=${NOTIFICATIONS_SSE_POLL_MS:2000}
