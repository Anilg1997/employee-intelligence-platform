spring.application.name=employee-intelligence-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_intelligence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=true
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}
employee.import.enabled=${EMPLOYEE_IMPORT_ENABLED:false}
employee.import.file=${EMPLOYEE_IMPORT_FILE:}
rag.ingestion.directory=${RAG_INGESTION_DIRECTORY:./documents}
rag.ingestion.max-file-size-bytes=${RAG_INGESTION_MAX_FILE_SIZE_BYTES:10485760}
rag.ingestion.allowed-extensions=${RAG_INGESTION_ALLOWED_EXTENSIONS:txt,md,csv,json}

# LangChain4j + Ollama
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_CHAT_MODEL:llama3.2}
langchain4j.ollama.chat-model.temperature=${OLLAMA_CHAT_TEMPERATURE:0.7}
langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
